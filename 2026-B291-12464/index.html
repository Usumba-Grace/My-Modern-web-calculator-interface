<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODERN WEB CALCULATOR INTERFACE DESIGN</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="calculatorbody">
        <input type="text" placeholder="0">
        <div id="Buttons">
            <button class="AC">AC</button>
            <button >00</button>
            <button >%</button>
            <button class="opt">&divide;</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="opt">&times;</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="opt">-</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="opt">+</button>
            <button class="large">0</button>
            <button class="dot">.</button>
            <button class="opt">=</button>
        </div>
    </div>
    
</body>
</html>
